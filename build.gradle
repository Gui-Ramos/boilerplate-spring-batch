plugins {
    id 'org.springframework.boot' version '3.4.0'  // Boot apenas no projeto principal!
    id 'io.spring.dependency-management' version '1.1.0'
    id 'java'
    id 'org.liquibase.gradle' version '2.2.0'
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Gui-Ramos/boilerplate-spring-batch")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'com.microservice.boilerplate'

    version = project.findProperty("${project.name}-version") ?: "1.0.0"  // Usa a versão definida no gradle.properties

    sourceCompatibility = '21'
    targetCompatibility = '21'

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = project.name  // Nome do módulo como artifactId
                version = project.version  // Versão do submódulo
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/Gui-Ramos/boilerplate-spring-batch")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }

}

bootJar {
    enabled = true
}
jar {
    enabled = false
}

tasks.register('installLocalGitHook', Copy) {
    from 'scripts'
    into '.git/hooks'
    fileMode 0775
}