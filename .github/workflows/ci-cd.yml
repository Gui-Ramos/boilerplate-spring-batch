name: Publish Boilerplate Package in Maven Central Repository

on:
  push:
    branches:
      - develop
      - release
      - main

jobs:

  release:
    runs-on: ubuntu-latest
    outputs:
      module_versions: ${{ steps.set-versions.outputs.module_versions }}
    permissions:
      pull-requests: write
      contents: write
      actions: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install
          npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/exec

      - name: Run semantic-release
        id: semantic-release
        run: |
          echo "{}" > versions.json
          MODULES=(common-library process-calendar-job)
          CHANGED_MODULES=()
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            for module in "${MODULES[@]}"; do
              if git diff --name-only HEAD~1 HEAD | grep -q "$module/"; then
                CHANGED_MODULES+=("$module")
              fi
            done
          else
            echo "🔍 Nenhum commit anterior encontrado, assumindo todos os módulos como modificados."
            CHANGED_MODULES=("${MODULES[@]}")
          fi
          for module in "${CHANGED_MODULES[@]}"; do
            VERSION=$(npx semantic-release --branches main --ci false | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [[ -n "$VERSION" ]]; then
              jq --arg module "$module" --arg version "$VERSION" '. + {($module): $version}' versions.json > temp.json && mv temp.json versions.json
            fi
          done
          echo "module_versions=$(cat versions.json)" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-modules:
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      pull-requests: write
      contents: write
      actions: write
      packages: write
    strategy:
      matrix:
        module: [ common-library, process-calendar-job ]
    if: ${{ needs.release.outputs.module_versions != '{}' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'
          server-id: github

      - name: Build and Publish ${{ matrix.module }}
        run: |
          VERSION=$(jq -r '."${{ matrix.module }}" // empty' <<< '${{ needs.release.outputs.module_versions }}')
          if [[ -n "$VERSION" ]]; then
            echo "📦 Buildando ${{ matrix.module }} versão $VERSION"
            ./gradlew :${{ matrix.module }}:publish -P${{ matrix.module }}Version=$VERSION
          else
            echo "⚠️ Nenhuma versão encontrada para ${{ matrix.module }}, pulando build."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}