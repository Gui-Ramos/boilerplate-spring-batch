name: Publish Boilerplate Package in Maven Central Repository

on:
  push:
    branches:
      - develop
      - release
      - main

jobs:

  release:
    runs-on: ubuntu-latest
    outputs:
      module_versions: ${{ steps.set-versions.outputs.module_versions }}
    permissions:
      pull-requests: write
      contents: write
      actions: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Garante que todo o histórico do repositório seja obtido

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev @changesets/cli

      - name: Create and apply Changesets versioning
        id: changesets
        run: |
          npx changeset version

      - name: Capture versions from Changesets
        id: set-versions
        run: |
          echo "🔍 Capturando versões geradas pelo Changesets..."
          MODULE_VERSIONS_JSON=$(jq -n 'reduce inputs as $item ({}; . + {($item.name): $item.version})' modules/*/build.gradle.kts | jq -s 'add')
          echo "module_versions=$MODULE_VERSIONS_JSON" >> $GITHUB_OUTPUT
          echo "📦 Versões capturadas: $MODULE_VERSIONS_JSON"

  build-modules:
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      pull-requests: write
      contents: write
      actions: write
      packages: write
    strategy:
      matrix:
        module: ${{ fromJSON(needs.release.outputs.module_versions) != '{}' && fromJSON(needs.release.outputs.module_versions) || [] }}
    if: ${{ needs.release.outputs.module_versions != '{}' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Garante que todo o histórico do repositório seja obtido

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'
          server-id: github

      - name: Build and Publish ${{ matrix.module }}
        run: |
          VERSION=$(jq -r '."${{ matrix.module }}" // empty' <<< '${{ needs.release.outputs.module_versions }}')
          if [[ -n "$VERSION" ]]; then
            echo "📦 Buildando ${{ matrix.module }} versão $VERSION"
            ./gradlew :modules:${{ matrix.module }}:publish -P${{ matrix.module }}Version=$VERSION
          else
            echo "⚠️ Nenhuma versão encontrada para ${{ matrix.module }}, pulando build."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
