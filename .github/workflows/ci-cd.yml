name: Publish Boilerplate Package in Maven Central Repository

on:
  push:
    branches:
      - develop
      - release
      - main

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          server-id: github

      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

  release:
    runs-on: ubuntu-latest
    outputs:
      common_library_version: ${{ steps.set-versions.outputs.COMMON_LIBRARY_VERSION }}
      process_calendar_job_version: ${{ steps.set-versions.outputs.PROCESS_CALENDAR_JOB_VERSION }}
    permissions:
      pull-requests: write
      contents: write
      actions: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install
          npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/exec

      - name: Run semantic-release
        run: |
          VERSION=$(npx semantic-release)
          echo "Determined version: $VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture versions from semantic-release
        id: set-versions
        run: |
          echo "🔍 Capturando versões geradas pelo semantic-release..."
          
          # Define a lista de módulos que devem ser rastreados
          MODULES=("common-library" "process-calendar-job")
          
          # Inicializa um JSON vazio para armazenar as versões
          MODULE_VERSIONS_JSON="{"
          
          for MODULE in "${MODULES[@]}"; do
            VAR_NAME=$(echo "$MODULE" | tr '-' '_' | tr '[:lower:]' '[:upper:]')_VERSION
            VERSION=${!VAR_NAME}
          
            if [[ -n "$VERSION" ]]; then
              echo "$VAR_NAME=$VERSION" >> $GITHUB_ENV
              MODULE_VERSIONS_JSON+="\"$MODULE\": \"$VERSION\", "
            fi
          done
          
          # Remove a última vírgula e fecha o JSON
          MODULE_VERSIONS_JSON="${MODULE_VERSIONS_JSON%, } }"
          echo "module_versions=$MODULE_VERSIONS_JSON" >> $GITHUB_OUTPUT
          
          echo "📦 Versões capturadas: $MODULE_VERSIONS_JSON"

  build-modules:
    runs-on: ubuntu-latest
    needs: [ release ]
    strategy:
      matrix:
        module: [ common-library, process-calendar-job ]
    if: ${{ needs.release.outputs.module_versions != '' }}
    steps:
      - name: Build and Publish ${{ matrix.module }}
        run: |
          VERSION=$(jq -r '.["${{ matrix.module }}"]' <<< '${{ needs.release.outputs.module_versions }}')
          if [[ "$VERSION" != "null" ]]; then
            echo "📦 Buildando ${{ matrix.module }} versão $VERSION"
            ./gradlew :${{ matrix.module }}:build -P${{ matrix.module }}Version=$VERSION
          fi