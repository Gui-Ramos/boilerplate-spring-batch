name: Publish Boilerplate Package in Maven Central Repository

on:
  push:
    branches:
      - develop
      - release
      - main

jobs:

  release:
    runs-on: ubuntu-latest
    outputs:
      module_versions: ${{ steps.set-versions.outputs.module_versions }}
    permissions:
      pull-requests: write
      contents: write
      actions: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Garante que todo o histórico do repositório seja obtido

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install
          npm install --save-dev @changesets/cli @changesets/apply-release-plan conventional-changelog-cli conventional-changelog-conventionalcommits

      - name: Gerar versões automaticamente com Conventional Commits
        run: |
          npx changeset status --since=develop --json > changeset-status.json
          if [[ $(jq '.releases | length' changeset-status.json) -eq 0 ]]; then
            echo "⚠️ Nenhuma alteração encontrada para versionamento."
            exit 0
          fi

          echo "📦 Gerando nova versão baseada nos commits..."
          npx changeset version

          # Commit das mudanças
          # git add .
          # git commit -m "chore(release): versão gerada automaticamente [skip ci]"
          # git push

          # Criar tags para cada versão
          # for module in $(jq -r '.releases[].name' changeset-status.json); do
            # version=$(jq -r --arg name "$module" '.releases[] | select(.name == $name) | .newVersion' changeset-status.json)
            # git tag "${module}-v${version}"
            # git push origin "${module}-v${version}"
          # done

      - name: Config Git Identity
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"


      - name: Criar changelog usando Conventional Commits
        run: |
          npx conventional-changelog -p conventionalcommits -i CHANGELOG.md -s
          git add CHANGELOG.md
          git commit -m "docs: Atualiza CHANGELOG automaticamente [skip ci]"
          git push

      - name: Verificar se package.json está presente
        run: |
          ls -l
          cat package.json

      - name: Capture versions from Changesets
        id: set-versions
        run: |
          echo "🔍 Capturando versões geradas pelo Changesets..."
          MODULE_VERSIONS_JSON=$(jq -n 'reduce inputs as $item ({}; . + {($item.name): $item.version})' **/package.json | jq -s 'add')
          echo "module_versions=$MODULE_VERSIONS_JSON" >> $GITHUB_ENV
          echo "📦 Versões capturadas: $MODULE_VERSIONS_JSON"

  build-modules:
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      pull-requests: write
      contents: write
      actions: write
      packages: write
    steps:
      - name: Verificar se há módulos para buildar
        run: |
          if [[ '${{ needs.release.outputs.module_versions }}' == '{}' ]]; then
            echo "🚫 Nenhum módulo para buildar. Finalizando job."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Garante que todo o histórico do repositório seja obtido

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'
          server-id: github

      - name: Build and Publish ${{ matrix.module }}
        run: |
          VERSION=$(jq -r '."${{ matrix.module }}" // empty' <<< '${{ needs.release.outputs.module_versions }}')
          if [[ -n "$VERSION" ]]; then
            echo "📦 Buildando ${{ matrix.module }} versão $VERSION"
            ./gradlew :modules:${{ matrix.module }}:publish -P${{ matrix.module }}Version=$VERSION
          else
            echo "⚠️ Nenhuma versão encontrada para ${{ matrix.module }}, pulando build."
          fi
        env:
          GITHUB_TOKEN: $
